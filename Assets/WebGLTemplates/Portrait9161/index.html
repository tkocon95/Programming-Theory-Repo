
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1,
                 user-scalable=no">

  <title>{{{ PRODUCT_NAME }}}</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #unity-canvas {
      display: block;
      flex: none;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: #231F20;
    }

    #unity-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font: 16px Arial, sans-serif;
      pointer-events: none;
    }

    #unity-footer {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10;
    }

    #unity-fullscreen-button {
      padding: 10px 14px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #222;
      color: #fff;
      cursor: pointer;
    }

    #unity-warning {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(90vw, 600px);
      color: #fff;
      font: 14px Arial, sans-serif;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas"
            width="1080"
            height="1920"
            tabindex="-1"></canvas>
  </div>

  <div id="unity-loading">Loading...</div>
  <div id="unity-warning"></div>

  <div id="unity-footer">
    <button id="unity-fullscreen-button" type="button">
      Fullscreen
    </button>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#unity-loading");
    const warning = document.querySelector("#unity-warning");

    function showWarning(message, type) {
      const box = document.createElement("div");
      box.textContent = message;
      box.style.padding = "10px";
      box.style.marginTop = "5px";
      box.style.background =
        type === "error" ? "#b00020" : "#a66b00";

      warning.appendChild(box);

      if (type !== "error") {
        setTimeout(() => box.remove(), 5000);
      }
    }

    // Keep the displayed canvas inside the viewport at 9:16.
    function resizeCanvas() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const width = Math.min(vw, vh * 9 / 16);
      const height = width * 16 / 9;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";

    const config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      showBanner: showWarning
    };

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        loading.textContent =
          "Loading... " + Math.round(progress * 100) + "%";
      }).then((unityInstance) => {
        loading.style.display = "none";

        document.querySelector("#unity-fullscreen-button")
          .addEventListener("click", () => {
            unityInstance.SetFullscreen(1);
          });
      }).catch((error) => {
        loading.textContent = "Unable to load game.";
        showWarning(String(error), "error");
      });
    };

    script.onerror = () => {
      loading.textContent = "Unable to load Unity loader.";
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
